หลังจากสร้าง windows server เสร็จแล้ว เราจะต้องทำการ promote server ให้เป็น domain controller และสร้าง user ใน Active Directory เพื่อให้สามารถจัดการและควบคุมการเข้าถึงทรัพยากรในเครือข่ายได้อย่างมีประสิทธิภาพ

วิธี promote domain controller
1. เปิด Server Manager
2. คลิกที่ "Add roles and features"
3. คลิก "Next" จนถึงหน้า "Select server roles"
4. เลือก "Active Directory Domain Services" แล้วคลิก "Next"
5. คลิก "Next" จนถึงหน้า "Confirm installation selections"
6. คลิก "Install" และรอจนกว่าการติดตั้งจะเสร็จสิ้น
7. หลังจากติดตั้งเสร็จสิ้น คลิกที่ "Promote this server to a domain controller"
8. เลือก "Add a new forest" และกรอกชื่อโดเมนที่ต้องการ เช่น "nichetel.local"
9. คลิก "Next" และกรอกข้อมูลที่จำเป็น เช่น รหัสผ่านสำหรับ Directory Services Restore Mode (DSRM)
10. คลิก "Next" จนถึงหน้า "Review Options" และตรวจสอบข้อมูลที่กรอก
11. คลิก "Next" และรอจนกว่าการโปรโมตจะเสร็จสิ้น
12. หลังจากโปรโมตเสร็จสิ้น เซิร์ฟเวอร์จะรีสตาร์ทอัตโนมัติ และจะกลายเป็น Domain Controller ของโดเมนที่คุณสร้างขึ้น

วิธี add user ใน Active Directory
1. เปิด "Active Directory Users and Computers" จาก Server Manager หรือ Start Menu
2. คลิกขวาที่โฟลเดอร์ "Users" หรือโฟลเดอร์ที่คุณต้องการสร้างผู้ใช้ใหม่
3. เลือก "New" > "User"
4. กรอกข้อมูลผู้ใช้ เช่น ชื่อ, นามสกุล, ชื่อผู้ใช้ (User logon name) และคลิก "Next"
5. กรอกและยืนยันรหัสผ่านสำหรับผู้ใช้ใหม่ และเลือกตัวเลือกที่เหมาะสม เช่น "User must change password at next logon" หรือ "Password never expires"
6. คลิก "Next" และตรวจสอบข้อมูลที่กรอก
7. คลิก "Finish" เพื่อสร้างผู้ใช้ใหม่ใน Active Directory

วิธี join domain
1. บนเครื่องลูกข่าย (Client) ที่ต้องการเข้าร่วมโดเมน ให้เปิด "System Properties" โดยคลิกขวาที่ "This PC" หรือ "My Computer" และเลือก "Properties"
2. คลิกที่ "Change settings" ในส่วน "Computer name, domain, and workgroup settings"
3. ในหน้า "System Properties" คลิกที่ "Change"
4. เลือก "Domain" และกรอกชื่อโดเมนที่คุณสร้างขึ้น เช่น "nichetel.local"
5. คลิก "OK" และกรอกชื่อผู้ใช้และรหัสผ่านของผู้ใช้ที่มีสิทธิ์เข้าร่วมโดเมน
6. คลิก "OK" และรอจนกว่าการเข้าร่วมโดเมนจะเสร็จสิ้น
7. หลังจากเข้าร่วมโดเมนเสร็จสิ้น เครื่องลูกข่ายจะต้องรีสตาร์ทเพื่อให้การเปลี่ยนแปลงมีผล

ตอนนี้ผมทำเว็ปแอป แล้วอยากจะเชื่อมต่อกับ Active Directory เพื่อให้ผู้ใช้สามารถล็อกอินด้วยบัญชีผู้ใช้ในโดเมนได้ คุณสามารถใช้ไลบรารีเช่น `ldap3` ใน Python เพื่อเชื่อมต่อและตรวจสอบข้อมูลผู้ใช้จาก Active Directory ได้ 

Prompt สำหรับทำการเชื่อมต่อกับ Active Directory
ผมมีแอปพลิเคชันที่ต้องการเชื่อมต่อกับ Active Directory เพื่อให้ผู้ใช้สามารถล็อกอินด้วยบัญชีผู้ใช้ในโดเมนได้ คุณสามารถช่วยผมเขียนโค้ด Python โดยใช้ไลบรารี `ldap3` เพื่อเชื่อมต่อและตรวจสอบข้อมูลผู้ใช้จาก Active Directory ได้ไหมครับ?
