[card: แสดงผล Memory] แสดงเป็นกราฟ คล้ายๆ Task Manager ใน Windows แล้วก็ไม่แน่ใจว่า Memory ควรดึงมาจาก docker หรือเป็น Memory ของเครื่อง server เลย เพราะปัจจุบันรันเว็ปแอปบน  docker
