services:
  backend:
    build: ./backend
    # Use Daphne (ASGI) so WebSocket/Channels work reliably behind a proxy
    command: sh -c "echo 'Starting Daphne ASGI server' && python -m daphne -b 0.0.0.0 -p 8080 config.asgi:application"
    volumes:
      - ./backend:/app
      # Mount host recordings directory into container for direct file access
      - C:\\Recordings\\Music:/recordings:ro
      # Mount the entire WSL2 /mnt folder to access all local and network drives dynamically
      - /mnt:/host_mnt:ro
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TZ=Asia/Bangkok
      # Mapping from Windows host path -> container mount point
      - HOST_TO_CONTAINER_MAPPINGS={"C:\\Recordings\\Music":"/recordings","Z:\\":"\\\\\\\\NICHETEL-DOMAIN\\\\Users\\\\Administrator\\\\Desktop\\\\"}
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - redis

  frontend:
    build: ./frontend
    # Run vite via node executable to avoid wrapper/script execution issues on mounted volumes
    command: ["sh", "-c", "node /app/node_modules/vite/bin/vite.js --host"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "6001:6001"
    env_file:
      - ./backend/.env
    restart: always

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    # no volumes/networks required for simple dev setup

volumes:
  frontend_node_modules:
  
