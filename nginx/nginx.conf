server {
    listen 80;
    server_name _; # ใส่ Domain Name หรือ IP ของเครื่อง VM
    return 301 https://$host$request_uri; # บังคับเปลี่ยนเป็น HTTPS
}

server {
    listen 443 ssl;
    server_name _;

    # ⚠️ ปรับแก้พาธ SSL Certificate ให้เป็นตำแหน่งบน Linux VM ของคุณ
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # 1. เสิร์ฟหน้าเว็บ Frontend (Vue 3 static build) โดยตรงจากเครื่อง Host
    location / {
        root /var/www/nt_playback/frontend/dist; # ⚠️ ชี้หาตำแหน่งที่คุณวางโฟลเดอร์ dist
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. เสิร์ฟไฟล์ Static ของฝั่ง Django Admin โดยตรง (เร็วและไม่กวน Container)
    location /static/ {
        alias /var/www/nt_playback/backend/staticfiles/; # ⚠️ พาธที่ทำ collectstatic ไว้
    }

    # 3. Proxy ส่ง API และตัวควบคุมดาวน์โหลดไฟล์มีเดีย ไปให้ Django Container (พอร์ต 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # 4. Proxy ส่ง WebSockets เชื่อมต่อกับ Django Container
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}